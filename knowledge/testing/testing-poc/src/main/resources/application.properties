spring.application.name=testing-poc

# Context path global de l'application
server.servlet.context-path=/api

# ==========================================
# H2 DATABASE
# ==========================================

spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Création du schéma au démarrage et suppression à l'arrêt
spring.jpa.hibernate.ddl-auto=create-drop

# Afficher les requêtes SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SQL INITIALIZATION
# ==========================================

# Exécuter data.sql après la création des tables JPA
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==========================================
# H2 CONSOLE
# ==========================================

spring.h2.console.enabled=false
#spring.h2.console.path=/h2-console

# ==========================================
# Logging
# ==========================================

# Chemin de stockage des logs
logging.file.path=C:/Users/Public/logs/testing-poc

# Niveau global
logging.level.root=INFO
logging.level.com.example.aspect=DEBUG

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

#Tracing

# Distributed tracing
# management.tracing.sampling.probability=1.0
# Export des traces vers Elastic
# management.opentelemetry.tracing.export.otlp.endpoint=http://10.10.1.100:4318/v1/traces

# Logging JSON ECS

logging.structured.format.console=ecs
