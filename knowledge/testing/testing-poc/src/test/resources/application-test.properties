# ==========================================
# APPLICATION TEST
# ==========================================
spring.application.name=testing-poc-test

# ==========================================
# H2 DATABASE - TEST
# ==========================================
# Base de données H2 distincte pour les tests
spring.datasource.url=jdbc:h2:mem:bankdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================
# Recréer le schéma à chaque démarrage du contexte de test
spring.jpa.hibernate.ddl-auto=create-drop

# ==========================================
# SQL INITIALIZATION
# ==========================================
# Exécuter les scripts SQL après la création des tables Hibernate
spring.jpa.defer-datasource-initialization=true

# Activer l'initialisation SQL pendant les tests
spring.sql.init.mode=always

# Exécuter uniquement test-data.sql depuis src/test/resources
spring.sql.init.data-locations=classpath:/test-data.sql

# ==========================================
# SQL LOGGING
# ==========================================
# Afficher les requêtes SQL pendant les tests
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true