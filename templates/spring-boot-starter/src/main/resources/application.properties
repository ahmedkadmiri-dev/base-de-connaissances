spring.application.name=@project.artifactId@
server.servlet.context-path=/api

# ==========================================
# H2 DATABASE
# ==========================================

spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Création du schéma au démarrage et suppression à l'arrêt
spring.jpa.hibernate.ddl-auto=create-drop

# Afficher les requêtes SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SQL INITIALIZATION
# ==========================================

# Exécuter data.sql après la création des tables JPA
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==========================================
# H2 CONSOLE
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

############################################################
# AUDIT
############################################################

# Audit datasource - H2
audit.datasource.url=jdbc:h2:mem:auditdb
audit.datasource.driver-class-name=org.h2.Driver
audit.datasource.username=sa
audit.datasource.password=

############################################################
# SECURITY
############################################################

# Activation de la configuration de sécurité
security.enabled=false
# URI accessibles sans authentification
security.public-endpoints[0]=/api/public/**
security.public-endpoints[1]=/actuator/health
security.public-endpoints[2]=/swagger-ui/**
security.public-endpoints[3]=/v3/api-docs/**
security.public-endpoints[4]=/api/h2-console/**

############################################################
# CORS
############################################################

security.cors.enabled=true
# Origines autorisées
security.cors.allowed-origins=http://localhost:4200,https://localhost:8088
# Méthodes HTTP autorisées
security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
# Headers autorisés
security.cors.allowed-headers=Authorization,Content-Type,Accept,Idempotency-Key,X-Requested-With
# Autoriser les cookies et credentials
security.cors.allow-credentials=true

############################################################
# JWT CONFIGURATION
############################################################

security.jwt.roles-claims[0]=realm_access.roles
security.jwt.authority-prefix=ROLE_

############################################################
# IDENTITY PROVIDER
############################################################

security.provider=KEYCLOAK
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak.example.com/realms/my-realm

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.boot.autoconfigure.security=DEBUG


# ==========================================
# Logging
# ==========================================

logging.file.path=C:/Users/Public/logs/testing-poc
logging.level.root=INFO
logging.level.com.example.aspect=DEBUG
logging.aspect.controller.include-headers=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

#Tracing

# Distributed tracing
# management.tracing.sampling.probability=1.0
# Export des traces vers Elastic
# management.opentelemetry.tracing.export.otlp.endpoint=http://10.10.1.100:4318/v1/traces

# Logging JSON ECS

logging.structured.format.console=ecs
